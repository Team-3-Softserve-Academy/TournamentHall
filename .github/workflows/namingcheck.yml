name: "Check PR Title"

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        run: |
          if [[ ! "${{ github.event.pull_request.title }}" =~ ^ROOT-[0-9]+ .+ ]]; then
            echo "::error ::PR title must follow format: ROOT-123 Your title"
            exit 1
          fi
          
name: "Check Branch Name"
on:
  create:
    branches:
      - '*' 

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          if [[ ! "${{ github.ref }}" =~ ^refs/heads/ROOT-[0-9]-.+]]; then
            echo "::error ::Branch name must follow format: ROOT-123"
            exit 1
          fi